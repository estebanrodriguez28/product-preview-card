<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main>
      <article class="card">
        <picture class="card__image-area">
          <source
            srcset="images/image-product-desktop.jpg"
            media="(min-width:992px)"
          />
          <img
            class="card__image"
            src="images/image-product-mobile.jpg"
            alt="product photo with perfume bottle against grey background with two green leaves on its sides"
          />
        </picture>
        <div class="card__content">
          <p class="card__category">Perfume</p>

          <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>

          <p class="card__description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="card__pricing">
            <p class="card__price">$149.99</p>
            <s class="card__price card__price--previous">$169.99</s>
          </div>
          <button class="card__button">
            <img src="images/icon-cart.svg" alt="" class="card__icon" />
            <span>Add to Cart</span>
          </button>
        </div>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener noreferrer"
        >Frontend Mentor</a
      >. Coded by
      <a
        href="https://www.frontendmentor.io/profile/estebanrodriguez28"
        target="_blank"
        rel="noopener noreferrer"
        >Esteban Rodriguez</a
      >.
    </footer>
  </body>
</html>
